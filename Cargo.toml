[workspace]
resolver = "2"
members = ["crates/proto", "crates/blotterd", "crates/blotter", "crates/blotter-hook"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
blotter-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Plain HTTP: the feed only travels over Tailscale, which already encrypts it.
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
strip = true
